name: Build Xiaomi Pad 6

on:
  push:
    branches: [pipa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ramdisk test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lz4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup target add --toolchain 1.99.1 aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          add-to-path: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/pipa-cust-installer -> target/pipa-cust-installer
      - name: Prepare bundled inputs
        run: |
          mkdir -p inputs
          gzip --decompress --stdout tools/pipa-ci/inputs/boot-fbboot.img.gz > inputs/boot-fbboot.img
          python3 tools/pipa-ci/package.py validate inputs/boot-fbboot.img
      - name: Build and verify pipa outputs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tools/pipa-ci/build.sh inputs/boot-fbboot.img out/pipa
      - uses: actions/upload-artifact@v7
        with:
          name: skyward-pipa-${{ github.sha }}
          path: |
            out/pipa/skyward-pipa-boot.img
            out/pipa/skyward-pipa-cust-installer.zip
            out/pipa/SHA256SUMS
            out/pipa/verification.json
            out/pipa/routing-verification.json
            out/pipa/retention-verification.json
            out/pipa/build-info.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish pipa prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: skyward-pipa-${{ github.sha }}
          path: out/pipa
      - name: Verify release assets
        working-directory: out/pipa
        run: sha256sum --check SHA256SUMS
      - name: Prepare release notes
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp tools/pipa-ci/RELEASE-NOTES.md out/pipa/RELEASE-NOTES.md
          {
            printf '\n## 构建信息\n\n'
            printf -- '- 源码提交：`%s`\n' "$RELEASE_COMMIT"
            printf -- '- 构建分支：`%s`\n' "$RELEASE_BRANCH"
            printf -- '- 校验值详情见随附的 `SHA256SUMS` 和 `build-info.json`。\n'
          } >> out/pipa/RELEASE-NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: pipa-build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "Skyward for Xiaomi Pad 6 · $RELEASE_TAG" \
            --prerelease \
            --notes-file out/pipa/RELEASE-NOTES.md \
            out/pipa/skyward-pipa-cust-installer.zip \
            out/pipa/skyward-pipa-boot.img \
            out/pipa/SHA256SUMS \
            out/pipa/RELEASE-NOTES.md
