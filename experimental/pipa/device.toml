[device]
codename = "pipa"
brand = "Xiaomi"
model = "Xiaomi Pad 6"
ab = true
binder_header = "SYST"
soc = { hans = "骁龙® 870 移动平台", hant = "Snapdragon® 870 行動平台", en = "Snapdragon® 870" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 1800
height = 2880
density = 390
diagonal = 11.0
normal_max_brightness = 2047
max_refresh_hz = 144
disable_blanking = true
reset_on_open = false

# The working TWRP base supplies init, device setup and security services.
# Do not start a second copy of its vendor daemons from Skyward.
[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
load = []

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee"]

[firmware]
partition = "modem"
mount_options = ["ro", "shortname=lower", "uid=1000", "gid=1000", "dmask=227", "fmask=337"]

# Before data is mounted, this path lives in the recovery's RAM root.
# cnss-daemon exits if the socket's parent directory is absent.
[[service]]
path = "/system/bin/mkdir"
args = ["-p", "/data/vendor/wifi/sockets"]
oneshot = true

# QRTR discovery must run before cnss powers up the built-in WLAN driver.
[[service]]
path = "/vendor/bin/qrtr-ns"
args = ["-f"]
libraries = ["/vendor/lib64", "/system/lib64"]

# The firmware waits for this second QMI client before creating wlan0.
[[service]]
path = "/vendor/bin/cnss-daemon"
args = ["-n", "-l"]
libraries = ["/vendor/lib64", "/system/lib64"]

[wlan]
modules = []
writes = [
    { path = "/sys/kernel/cnss/fs_ready", value = "1" },
    { path = "/dev/wlan", value = "ON\n" },
]
firmware = [
    { name = "wlan/qca_cld/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"
